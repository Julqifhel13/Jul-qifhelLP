# Netlify build settings.
#
# The default build targets GitHub Pages, which serves the site from a
# sub-path (/Jul-qifhelLP/). Netlify serves from the root of the domain, so
# BASE_PATH is overridden here — without it every asset URL would carry the
# GitHub Pages prefix and 404.
#
# Both hosts keep working: GitHub Actions builds without BASE_PATH set and
# still gets the sub-path build.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  BASE_PATH = "/"

# Vite fingerprints everything in /assets, so those URLs are safe to cache
# forever — a change produces a new filename.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Screenshots and the headshot are stable but not fingerprinted; a day of
# caching with revalidation keeps repeat visits fast without pinning stale art.
[[headers]]
  for = "/projects/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"
